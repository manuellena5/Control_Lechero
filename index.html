<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Control Lechero</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2D6A4F">
  <meta name="description" content="Control de producción lechera para veterinarios">

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="C. Lechero">
  <link rel="apple-touch-icon" href="icons/icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <main id="app-content"></main>

    <nav id="bottom-nav">
      <button class="nav-item" data-route="home" onclick="navigate('/')">
        <svg viewBox="0 0 24 24"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/><path d="M3 12v9h18v-9"/></svg>
        Inicio
      </button>
      <button class="nav-item" data-route="tambos" onclick="navigate('/tambos')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        Tambos
      </button>
      <button class="nav-item" data-route="historial" onclick="navigate('/historial')">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
        Historial
      </button>
      <button class="nav-item" data-route="config" onclick="navigate('/config')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        Config
      </button>
    </nav>
  </div>

  <script src="js/dexie.js"></script>
  <script src="js/db.js"></script>
  <script src="js/router.js"></script>
  <script src="js/home.js"></script>
  <script src="js/tambos.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/registro.js"></script>
  <script src="js/planilla.js"></script>
  <script src="js/padron.js"></script>
  <script src="js/config.js"></script>

  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'null:' && location.hostname !== '') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
    initSync();
    initRouter();
  </script>
</body>
</html>
